services:
  postgres:
    image: postgres:16-alpine
    container_name: cti-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cti
    ports:
      - "5432:5432"
    volumes:
      - cti_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cti"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cti-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - cti_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cti_pgdata:
  cti_redisdata: