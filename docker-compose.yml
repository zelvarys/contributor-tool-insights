services:
  postgres:
    image: postgres:16-alpine
    container_name: rti-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rti
    ports:
      - "5432:5432"
    volumes:
      - rti_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rti"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: rti-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - rti_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rti_pgdata:
  rti_redisdata: